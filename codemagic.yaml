# Passos compartilhados pelos workflows (âncoras YAML). O build e a assinatura
# são os mesmos nos dois; só o workflow de tag publica GitHub Release.
definitions:
  scripts:
    - &gerar_projeto
      name: Gerar projeto Android (android/ nao e versionado)
      script: |
        set -e
        flutter create --org com.unitec --project-name unitec_forca_vendas --platforms=android .
        # Rede de seguranca (inofensivo no AGP 8.x): se algum dia voltar ao AGP 9,
        # mantem o DSL legado/KGP externo que o nosso build.gradle.kts usa.
        grep -q '^android.newDsl=' android/gradle.properties || echo 'android.newDsl=false' >> android/gradle.properties
        grep -q '^android.builtInKotlin=' android/gradle.properties || echo 'android.builtInKotlin=false' >> android/gradle.properties
        # Diagnostico: registra no log qual AGP/Flutter foi usado de fato.
        echo "----- Flutter -----"; flutter --version || true
        echo "----- AGP gerado -----"; grep -i "com.android.application" android/settings.gradle.kts || true
    - &aplicar_manifest
      name: Aplicar AndroidManifest (permissoes + HTTP cleartext + FileProvider)
      script: |
        set -e
        cp ci/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
        mkdir -p android/app/src/main/res/xml
        cp ci/file_paths.xml android/app/src/main/res/xml/file_paths.xml
    - &main_activity
      name: MainActivity (FragmentActivity + WhatsApp PDF direto)
      script: |
        set -e
        DEST=$(find android -name 'MainActivity.kt' | head -n 1)
        if [ -z "$DEST" ]; then
          echo "ERRO: MainActivity.kt nao gerado pelo flutter create"
          exit 1
        fi
        # Pacote do arquivo gerado (ex.: com.unitec.unitec_forca_vendas)
        PKG=$(dirname "$DEST" | sed -n 's|.*/kotlin/\(.*\)|\1|p' | tr '/' '.')
        cp ci/MainActivity.kt "$DEST"
        if [ -n "$PKG" ]; then
          sed -i.bak "1s/^package .*/package $PKG/" "$DEST"
          rm -f "$DEST.bak"
        fi
        echo "MainActivity instalado em $DEST (package $PKG)"
    - &assinatura_release
      name: Configurar assinatura de release (chave estavel)
      script: |
        set -e
        # Atualizacao in-place no Android exige MESMA assinatura em todos os APKs.
        # Ordem: (1) grupo keystore_credentials no Codemagic; (2) ci/unitecfv-release.p12
        # versionado no repo. NUNCA gerar keystore aleatoria a cada build.
        STOREPASS="${CM_KEYSTORE_PASSWORD:-unitecfv2026}"
        ALIAS="${CM_KEY_ALIAS:-unitecfv}"
        KEYPASS="${CM_KEY_PASSWORD:-$STOREPASS}"
        STORE_TYPE=""
        if [ -n "$CM_KEYSTORE" ]; then
          echo "Assinatura: keystore do grupo Codemagic (estavel)."
          STORE_FILE="$CM_BUILD_DIR/release-from-group.keystore"
          echo "$CM_KEYSTORE" | base64 --decode > "$STORE_FILE"
        elif [ -f ci/unitecfv-release.p12 ]; then
          echo "Assinatura: ci/unitecfv-release.p12 do repositorio (estavel)."
          STORE_FILE="$CM_BUILD_DIR/unitecfv-release.p12"
          cp ci/unitecfv-release.p12 "$STORE_FILE"
          STORE_TYPE="pkcs12"
        else
          echo "ERRO: nenhuma keystore de release encontrada."
          echo "Adicione ci/unitecfv-release.p12 ao repo ou configure o grupo keystore_credentials."
          exit 1
        fi
        {
          printf 'storePassword=%s\n' "$STOREPASS"
          printf 'keyPassword=%s\n' "$KEYPASS"
          printf 'keyAlias=%s\n' "$ALIAS"
          printf 'storeFile=%s\n' "$STORE_FILE"
          [ -n "$STORE_TYPE" ] && printf 'storeType=%s\n' "$STORE_TYPE"
        } > android/key.properties
        cp ci/build.gradle.kts android/app/build.gradle.kts
        rm -f android/app/build.gradle
    - &instalar_dependencias
      name: Instalar dependencias
      script: flutter pub get
    - &gerar_icone
      name: Gerar icone do app (android/ e regenerado a cada build)
      script: |
        set -e
        test -f assets/icon/app_icon.png
        dart run flutter_launcher_icons

workflows:
  forca-vendas-android:
    name: Forca de Vendas - Android APK
    # Conta individual Free: minutos no Mac M2. linux_x2 exige billing.
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      # Fixado em 3.35.x: a stable atual gera AGP 9.0 (newDsl), que quebra o
      # build.gradle.kts. Esta versao gera AGP 8.9.1 + Gradle 8.12 + Kotlin 2.1.0
      # (conjunto testado pelo time do Flutter), onde o build compila sem erro.
      # Manter igual no workflow de Release.
      flutter: 3.35.0
      java: 17
      groups:
        # Grupo com as credenciais da keystore (cadastre no Codemagic):
        #   CM_KEYSTORE          -> conteudo da keystore em base64
        #   CM_KEYSTORE_PASSWORD -> senha do store
        #   CM_KEY_ALIAS         -> alias da chave
        #   CM_KEY_PASSWORD      -> senha da chave
        # Enquanto o grupo nao existir, o CI usa ci/unitecfv-release.p12 do repo.
        - keystore_credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - *gerar_projeto
      - *aplicar_manifest
      - *main_activity
      - *assinatura_release
      - *instalar_dependencias
      - *gerar_icone
      - name: Build APK release (versao = pubspec)
        script: |
          set -e
          # Fonte unica: version X.Y.Z+NN do pubspec.yaml -> versionName X.Y.Z, versionCode NN.
          # O BUILD_NUMBER do Codemagic nao entra no APK. Suba o +NN a cada versao.
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/[[:space:]]*$//')
          VERSION_NAME="${PUBSPEC_VERSION%%+*}"
          VERSION_CODE="${PUBSPEC_VERSION##*+}"
          echo "versionName=$VERSION_NAME versionCode=$VERSION_CODE (build Codemagic #$BUILD_NUMBER)"
          flutter build apk --release --build-name="$VERSION_NAME" --build-number="$VERSION_CODE"
    artifacts:
      - build/app/outputs/apk/release/Unitec-Forca-Vendas-*.apk
    publishing:
      email:
        recipients:
          - TROQUE_PELO_SEU_EMAIL@exemplo.com
        notify:
          success: true
          failure: true

  # Só roda por tag vX.Y.Z (push da tag no GitHub). Build manual/push na main
  # não passa por aqui, então nunca publica Release sem tag.
  forca-vendas-android-release:
    name: Forca de Vendas - GitHub Release (tag)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.35.0
      java: 17
      groups:
        - keystore_credentials
        # GITHUB_TOKEN: token com permissão "Contents: Read and write" neste repositório.
        - github_release
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Validar tag x pubspec (antes de gastar build)
        script: |
          set -e
          if [ -z "${CM_TAG:-}" ]; then
            echo "ERRO: este workflow publica GitHub Release e só pode rodar por tag (vX.Y.Z)."
            exit 1
          fi
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "ERRO: GITHUB_TOKEN ausente. Cadastre no grupo 'github_release' do Codemagic."
            exit 1
          fi
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/[[:space:]]*$//')
          VERSION_NAME="${PUBSPEC_VERSION%%+*}"
          VERSION_CODE="${PUBSPEC_VERSION##*+}"
          if [ "$CM_TAG" != "v$VERSION_NAME" ]; then
            echo "ERRO: tag $CM_TAG não confere com pubspec.yaml ($PUBSPEC_VERSION). Esperado: v$VERSION_NAME"
            exit 1
          fi
          APP_INFO_VERSION=$(sed -n "s/.*kAppVersion = '\(.*\)'.*/\1/p" lib/app_info.dart)
          if [ "$APP_INFO_VERSION" != "$VERSION_NAME" ]; then
            echo "ERRO: lib/app_info.dart ($APP_INFO_VERSION) diferente do pubspec ($VERSION_NAME)."
            exit 1
          fi
          APP_INFO_BUILD=$(sed -n 's/.*kAppBuild = \([0-9]*\).*/\1/p' lib/app_info.dart)
          if [ "$APP_INFO_BUILD" != "$VERSION_CODE" ]; then
            echo "ERRO: kAppBuild ($APP_INFO_BUILD) em lib/app_info.dart diferente do pubspec (+$VERSION_CODE)."
            exit 1
          fi
          {
            echo "RELEASE_VERSION_NAME=$VERSION_NAME"
            echo "RELEASE_VERSION_CODE=$VERSION_CODE"
          } >> "$CM_ENV"
          echo "Release $CM_TAG -> versionName $VERSION_NAME, versionCode $VERSION_CODE"
      - *gerar_projeto
      - *aplicar_manifest
      - *main_activity
      - *assinatura_release
      - *instalar_dependencias
      - *gerar_icone
      - name: Build APK release (versionCode = pubspec)
        script: |
          set -e
          # Release tem versionCode fixo do pubspec: a mesma tag gera sempre o mesmo APK.
          flutter build apk --release --build-name="$RELEASE_VERSION_NAME" --build-number="$RELEASE_VERSION_CODE"
      - name: Conferir assinatura e preparar arquivos da Release
        script: |
          set -e
          SRC="build/app/outputs/apk/release/Unitec-Forca-Vendas-$RELEASE_VERSION_NAME.apk"
          test -f "$SRC" || { echo "ERRO: APK não encontrado em $SRC"; ls -la build/app/outputs/apk/release || true; exit 1; }

          # O APK publicado precisa estar assinado com a chave de release (nunca a de debug).
          prop() { sed -n "s/^$1=//p" android/key.properties; }
          STORE_FILE=$(prop storeFile); STOREPASS=$(prop storePassword); ALIAS=$(prop keyAlias); STORE_TYPE=$(prop storeType)
          KEYTOOL_TYPE=""; [ -n "$STORE_TYPE" ] && KEYTOOL_TYPE="-storetype $STORE_TYPE"
          ESPERADO=$(keytool -list -v -keystore "$STORE_FILE" -storepass "$STOREPASS" -alias "$ALIAS" $KEYTOOL_TYPE \
            | sed -n 's/.*SHA256: *//p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER=$(ls -d "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          test -n "$APKSIGNER" || { echo "ERRO: apksigner não encontrado em $SDK/build-tools"; exit 1; }
          OBTIDO=$("$APKSIGNER" verify --print-certs "$SRC" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: *//p' | head -n 1 | tr 'A-F' 'a-f')
          if [ -z "$ESPERADO" ] || [ "$ESPERADO" != "$OBTIDO" ]; then
            echo "ERRO: assinatura do APK ($OBTIDO) diferente da chave de release ($ESPERADO)."
            exit 1
          fi
          echo "Assinatura OK (SHA-256 do certificado: $OBTIDO)"

          mkdir -p build/github-release
          ASSET="unitec-forca-vendas-$RELEASE_VERSION_NAME.apk"
          cp "$SRC" "build/github-release/$ASSET"
          (cd build/github-release && shasum -a 256 "$ASSET" > "$ASSET.sha256")
          SHA=$(cut -d' ' -f1 "build/github-release/$ASSET.sha256")
          cat > build/github-release/notes.md <<EOF
          Unitec Força de Vendas $CM_TAG

          - Versão: $RELEASE_VERSION_NAME (versionCode $RELEASE_VERSION_CODE)
          - APK: \`$ASSET\`
          - SHA-256 do APK: \`$SHA\`
          - Certificado de assinatura (SHA-256): \`$OBTIDO\`
          - Commit: $CM_COMMIT
          EOF
          cat build/github-release/notes.md
      - name: Publicar GitHub Release
        script: |
          set -e
          command -v gh >/dev/null 2>&1 || brew install gh
          REPO=$(git config --get remote.origin.url | sed -E 's#.*github\.com[:/]##; s#\.git$##')
          ASSET="build/github-release/unitec-forca-vendas-$RELEASE_VERSION_NAME.apk"
          export GH_TOKEN="$GITHUB_TOKEN"
          if gh release view "$CM_TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $CM_TAG já existe em $REPO: atualizando os arquivos."
            gh release upload "$CM_TAG" "$ASSET" "$ASSET.sha256" --repo "$REPO" --clobber
          else
            gh release create "$CM_TAG" "$ASSET" "$ASSET.sha256" \
              --repo "$REPO" \
              --verify-tag \
              --title "Unitec Força de Vendas $CM_TAG" \
              --notes-file build/github-release/notes.md
          fi
          gh release view "$CM_TAG" --repo "$REPO" --json url,assets \
            --jq '"Release: " + .url, (.assets[] | "Asset: " + .name + " -> " + .url)'
    artifacts:
      - build/github-release/*.apk
      - build/github-release/*.sha256
    publishing:
      email:
        recipients:
          - TROQUE_PELO_SEU_EMAIL@exemplo.com
        notify:
          success: true
          failure: true
